name: Build ScorePadel Android

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'URL del tuo sito Vercel o Netlify (senza / finale, es. https://scorepadel.vercel.app)'
        required: true
        default: 'https://scorepadel.vercel.app'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepara progetto Capacitor Android
        run: |
          mkdir -p android-build/www
          if [ -f "index.html" ]; then
            cp index.html android-build/www/index.html
          elif [ -f "app/index.html" ]; then
            cp app/index.html android-build/www/index.html
          else
            echo "Errore: index.html non trovato né nella root né in app/index.html"
            exit 1
          fi
          cd android-build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.scorepadel.app",
            "appName": "ScorePadel",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android

      - name: Configura RAM (largeHeap), GPU, WakeLock e Microfono
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          manifest = Path('android-build/android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text(encoding='utf-8')
          if 'android:largeHeap="true"' not in xml:
              xml = xml.replace(
                  '<application',
                  '<application\n        android:largeHeap="true"\n        android:hardwareAccelerated="true"',
                  1
              )
          perms = [
              'android.permission.WAKE_LOCK',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
          ]
          for p in perms:
              if p not in xml:
                  xml = xml.replace(
                      '<application',
                      f'<uses-permission android:name="{p}" />\n    <application',
                      1
                  )
          manifest.write_text(xml, encoding='utf-8')
          PYEOF

      - name: Configura Zoom, Auto-Update, Endpoint API e Download nativo in MainActivity
        env:
          INPUT_SITE_URL: ${{ github.event.inputs.site_url }}
        run: |
          SITE_URL="${INPUT_SITE_URL:-https://scorepadel.vercel.app}"
          SITE_URL="${SITE_URL%/}"
          if echo "$SITE_URL" | grep -qi "netlify.app"; then
            API_ENDPOINT="${SITE_URL}/.netlify/functions/telecronaca"
          else
            API_ENDPOINT="${SITE_URL}/api/telecronaca"
          fi
          REMOTE_INDEX_URL="${SITE_URL}/index.html"
          echo "REMOTE_INDEX_URL=$REMOTE_INDEX_URL"
          echo "API_ENDPOINT=$API_ENDPOINT"

          cat << 'EOF' > android-build/android/app/src/main/java/com/scorepadel/app/MainActivity.java
          package com.scorepadel.app;

          import android.app.AlertDialog;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Toast;

          import com.getcapacitor.BridgeActivity;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends BridgeActivity {
              private static final String REMOTE_URL = "__REMOTE_INDEX_URL__";
              private static final String API_ENDPOINT = "__API_ENDPOINT__";
              private static final String UPDATE_DIR = "scorepadel-web";
              private final Map<String, OutputStream> openDownloads = new HashMap<>();

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  File cachedIndex = new File(new File(getFilesDir(), UPDATE_DIR), "index.html");
                  if (cachedIndex.exists() && cachedIndex.length() > 50000) {
                      getBridge().setServerBasePath(cachedIndex.getParentFile().getAbsolutePath());
                  }

                  setupWebViewAndDownloader();
                  checkRemoteUpdateInBackground();
              }

              private void setupWebViewAndDownloader() {
                  WebView webView = getBridge().getWebView();
                  if (webView == null) return;

                  WebSettings settings = webView.getSettings();
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new NativeDownloadBridge(), "ScorePadelNative");
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      if (url != null && url.startsWith("blob:")) {
                          String safeUrl = url.replace("\\", "\\\\").replace("'", "\\'");
                          String safeMime = (mimeType != null ? mimeType : "application/octet-stream").replace("'", "\\'");
                          String js = "(async function(){"
                              + "try{"
                              + "  const a = document.querySelector('a[href=\"' + '" + safeUrl + "' + '\"]');"
                              + "  const resp = await fetch('" + safeUrl + "');"
                              + "  const blob = await resp.blob();"
                              + "  const mt = (blob.type || '" + safeMime + "').toLowerCase();"
                              + "  const ext = mt.includes('json') ? '.json' : (mt.includes('png') ? '.png' : (mt.includes('webm') ? '.webm' : '.mp4'));"
                              + "  const prefix = ext === '.json' ? 'ScorePadel_Partita_' : (ext === '.png' ? 'ScorePadel_Grafica_' : 'ScorePadel_Video_');"
                              + "  let fname = (a && a.getAttribute('download')) ? a.getAttribute('download') : (prefix + Date.now() + ext);"
                              + "  const id = String(Date.now()) + '_' + Math.random();"
                              + "  ScorePadelNative.openFile(id, fname, blob.type || '" + safeMime + "');"
                              + "  const chunkSize = 2 * 1024 * 1024;"
                              + "  for (let off = 0; off < blob.size; off += chunkSize) {"
                              + "    const slice = blob.slice(off, off + chunkSize);"
                              + "    const b64 = await new Promise((res, rej) => {"
                              + "      const r = new FileReader();"
                              + "      r.onload = () => res(String(r.result).split(',')[1] || '');"
                              + "      r.onerror = rej;"
                              + "      r.readAsDataURL(slice);"
                              + "    });"
                              + "    ScorePadelNative.writeChunk(id, b64);"
                              + "  }"
                              + "  ScorePadelNative.closeFile(id, fname);"
                              + "} catch(e) { ScorePadelNative.onError(String(e)); }"
                              + "})();";
                          webView.evaluateJavascript(js, null);
                      }
                  });
              }

              private class NativeDownloadBridge {
                  @JavascriptInterface
                  public String getApiEndpoint() {
                      return API_ENDPOINT;
                  }

                  @JavascriptInterface
                  public void openFile(String id, String fileName, String mimeType) {
                      try {
                          OutputStream os;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                              values.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) return;
                              os = getContentResolver().openOutputStream(uri);
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              if (!dir.exists()) dir.mkdirs();
                              os = new FileOutputStream(new File(dir, fileName));
                          }
                          if (os != null) {
                              synchronized (openDownloads) {
                                  openDownloads.put(id, os);
                              }
                          }
                      } catch (Exception e) {
                          onError(e.getMessage());
                      }
                  }

                  @JavascriptInterface
                  public void writeChunk(String id, String base64Chunk) {
                      try {
                          OutputStream os;
                          synchronized (openDownloads) {
                              os = openDownloads.get(id);
                          }
                          if (os != null && base64Chunk != null && !base64Chunk.isEmpty()) {
                              byte[] bytes = Base64.decode(base64Chunk, Base64.DEFAULT);
                              os.write(bytes);
                          }
                      } catch (Exception e) {
                          onError(e.getMessage());
                      }
                  }

                  @JavascriptInterface
                  public void closeFile(String id, String fileName) {
                      try {
                          OutputStream os;
                          synchronized (openDownloads) {
                              os = openDownloads.remove(id);
                          }
                          if (os != null) {
                              os.flush();
                              os.close();
                          }
                          runOnUiThread(() -> Toast.makeText(
                              MainActivity.this,
                              "Salvato in Download: " + fileName,
                              Toast.LENGTH_LONG
                          ).show());
                      } catch (Exception e) {
                          onError(e.getMessage());
                      }
                  }

                  @JavascriptInterface
                  public void onError(String msg) {
                      runOnUiThread(() -> Toast.makeText(
                          MainActivity.this,
                          "Errore salvataggio file: " + msg,
                          Toast.LENGTH_LONG
                      ).show());
                  }
              }

              private int extractVersion(String html) {
                  if (html == null) return 0;
                  Matcher m = Pattern.compile("version:\\s*(\\d+)").matcher(html);
                  return m.find() ? Integer.parseInt(m.group(1)) : 0;
              }

              private String readStream(InputStream is) throws Exception {
                  BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));
                  StringBuilder sb = new StringBuilder();
                  char[] buf = new char[8192];
                  int n;
                  while ((n = br.read(buf)) != -1) sb.append(buf, 0, n);
                  return sb.toString();
              }

              private int getCurrentLocalVersion() {
                  try {
                      File cachedIndex = new File(new File(getFilesDir(), UPDATE_DIR), "index.html");
                      if (cachedIndex.exists() && cachedIndex.length() > 50000) {
                          try (InputStream is = new FileInputStream(cachedIndex)) {
                              return extractVersion(readStream(is));
                          }
                      }
                      try (InputStream is = getAssets().open("public/index.html")) {
                          return extractVersion(readStream(is));
                      }
                  } catch (Exception ignored) {
                      return 0;
                  }
              }

              private void checkRemoteUpdateInBackground() {
                  new Thread(() -> {
                      try {
                          Thread.sleep(1500);
                          URL url = new URL(REMOTE_URL + "?t=" + System.currentTimeMillis());
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(7000);
                          conn.setReadTimeout(10000);
                          conn.setRequestProperty("Cache-Control", "no-cache");
                          if (conn.getResponseCode() != 200) return;

                          String remoteHtml;
                          try (InputStream is = conn.getInputStream()) {
                              remoteHtml = readStream(is);
                          }
                          if (remoteHtml.length() < 50000 || !remoteHtml.contains("SCOREPADEL")) return;

                          int localVer = getCurrentLocalVersion();
                          int remoteVer = extractVersion(remoteHtml);
                          if (remoteVer <= localVer) return;

                          runOnUiThread(() -> {
                              if (isFinishing() || isDestroyed()) return;
                              new AlertDialog.Builder(MainActivity.this)
                                  .setTitle("Aggiornamento disponibile")
                                  .setMessage("È disponibile ScorePadel v" + remoteVer + " (attuale: v" + localVer + ").\nVuoi aggiornare adesso?")
                                  .setPositiveButton("Aggiorna ora", (d, w) -> applyUpdate(remoteHtml, remoteVer))
                                  .setNegativeButton("Più tardi", null)
                                  .show();
                          });
                      } catch (Exception ignored) {
                          // Silenzioso se offline
                      }
                  }).start();
              }

              private void applyUpdate(String remoteHtml, int remoteVer) {
                  try {
                      File dir = new File(getFilesDir(), UPDATE_DIR);
                      if (!dir.exists()) dir.mkdirs();
                      File target = new File(dir, "index.html");
                      try (FileOutputStream fos = new FileOutputStream(target)) {
                          fos.write(remoteHtml.getBytes(StandardCharsets.UTF_8));
                      }
                      getBridge().setServerBasePath(dir.getAbsolutePath());
                      Toast.makeText(this, "ScorePadel aggiornato alla v" + remoteVer + "!", Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Errore aggiornamento: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }
          }
          EOF

          python3 - << PYEOF
          from pathlib import Path
          p = Path('android-build/android/app/src/main/java/com/scorepadel/app/MainActivity.java')
          txt = p.read_text(encoding='utf-8')
          txt = txt.replace('__REMOTE_INDEX_URL__', '${REMOTE_INDEX_URL}')
          txt = txt.replace('__API_ENDPOINT__', '${API_ENDPOINT}')
          p.write_text(txt, encoding='utf-8')
          PYEOF

      - name: Compila ScorePadel_Android.apk
        run: |
          cd android-build/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ScorePadel_Android.apk

      - name: Carica APK scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: ScorePadel-Android-APK
          path: android-build/ScorePadel_Android.apk
